            /* 이전에 이 부분에 background가 명시되어 있었다면 제거해야 합니다. */
            /* background: var(--color-sunshine);  <= 이런 줄이 있었다면 제거 */
        }
        @keyframes bounce {            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }            40% { transform: translateY(-10px); }            60% { transform: translateY(-5px); }        }
        
        .analysis-section {            background: var(--color-light-gray);            border-radius: 1.5em;            padding: 2em;            margin: 2em 0;            text-align: left;        }
        .analysis-section h3 {            font-size: 1.4em;            font-weight: 800;            color: var(--color-brick);            margin-bottom: 1em;            text-align: center;        }

        @media (max-width: 500px) {

    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <script>
        // 카카오 SDK 초기화
        // YOUR_KAKAO_JS_KEY는 app.py에서 kakao_js_key 변수로 전달되어야 합니다.
        if (Kakao && !Kakao.isInitialized()) {
            Kakao.init('{{ kakao_js_key }}');
        }

        const inputScreen = document.getElementById('input-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const resultScreen = document.getElementById('result-screen');
        const analyzeButton = document.getElementById('analyze-button');
        const kakaoShareButton = document.getElementById('kakao-share-button');
        
        let userBirthDate = '';
        let userGender = '';
        let luckyNumbers = [];
        // luckyTips와 analysisResult 변수를 여기서 선언합니다.
        let luckyTips = []; 
        let analysisResult = [];
        
        // 이 부분의 calculateLuckyNumbers 등은 백엔드 API를 호출하므로 더미 함수로 남겨둡니다.
        function calculateLuckyNumbers(birthDate, gender) {
            console.warn("calculateLuckyNumbers는 이제 백엔드에서 처리됩니다. 프론트엔드에서는 호출되지 않아야 합니다.");
            return []; 
        }
        
        // 로딩 단계 시뮬레이션 (이 함수는 그대로 유지)
        async function showLoadingProcess() {
            const steps = [
                "생년월일 분석 중...",
                "숫자학 계산 중...",
                "개인 운세 해석 중...",
                "행운 요소 추출 중...",
                "최종 결과 생성 중..."
            ];
            
            const loadingStepElement = document.getElementById('loading-step');
            for (let i = 0; i < steps.length; i++) {
                loadingStepElement.textContent = steps[i];
                await new Promise(resolve => setTimeout(resolve, 800));
            }
        }

        // 분석 실행 (수정: 백엔드 API 호출)
        async function analyzeNumbers() {
            const birthDate = document.getElementById('birthdate').value;
            const gender = document.getElementById('gender').value;
            
            if (!birthDate) {
                alert('생년월일을 입력해주세요!');
                return;
            }
            
            userBirthDate = birthDate;
            userGender = gender;
            
            // 화면 전환
            inputScreen.style.display = 'none';
            loadingScreen.style.display = 'block';
            
            // 로딩 프로세스 시뮬레이션
            await showLoadingProcess();
            
            // 백엔드 API 호출
            try {
                const response = await fetch('/api/calculate-birthday-lotto', { // 새 API 엔드포인트
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ birthdate: birthDate, gender: gender })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    alert('오류: ' + data.error);
                    // 에러 발생 시 입력 화면으로 돌아가거나 에러 메시지 표시
                    loadingScreen.style.display = 'none';
                    inputScreen.style.display = 'block';
                    return;
                }
                
                luckyNumbers = data.numbers; // 백엔드에서 받은 번호
                analysisResult = data.number_meanings; // 백엔드에서 받은 의미
                luckyTips = data.lucky_tips; // 백엔드에서 받은 팁
                
                // 결과 화면으로 전환
                loadingScreen.style.display = 'none';
                resultScreen.style.display = 'block';
                
                // 결과 표시
                displayResults();
                
            } catch (error) {
                console.error('API 호출 오류:', error);
                alert('번호 분석 중 오류가 발생했습니다. 다시 시도해주세요.');
                loadingScreen.style.display = 'none';
                inputScreen.style.display = 'block';
            }
        }
        
        // 결과 표시 (백엔드에서 받은 데이터로 표시)
        function displayResults() {
            const date = new Date(userBirthDate);
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            
            // 생년월일 정보 표시
            document.getElementById('birth-info').textContent = 
                `${year}년 ${month}월 ${day}일 생`;
            
            // 행운 숫자 표시
            const luckyNumbersDiv = document.getElementById('lucky-numbers');
            luckyNumbersDiv.innerHTML = ''; // 기존 내용 초기화
            luckyNumbers.forEach(num => { // luckyNumbers는 이제 백엔드에서 온 데이터
                const ball = document.createElement('div');
                ball.className = 'lucky-ball'; // 기본 클래스
                ball.textContent = String(num); // 숫자를 명확하게 문자열로 변환하여 할당

                // 로또볼 색상 클래스 추가 (static/style.css의 .ball.n1~n5와 동일하게)
                const colorCategory = Math.floor((num - 1) / 10) + 1; // 1-10:1, 11-20:2, 21-30:3, 31-40:4, 41-45:5
                ball.classList.add(`n${colorCategory}`); 

                luckyNumbersDiv.appendChild(ball);
            });
            
            // 숫자 의미 표시
            const meaningsDiv = document.getElementById('number-meanings');
            meaningsDiv.innerHTML = '';
            analysisResult.forEach(item => { // analysisResult는 백엔드에서 온 데이터
                const meaningDiv = document.createElement('div');
                meaningDiv.className = 'number-meaning';
                meaningDiv.innerHTML = `
                    <div class="number">숫자 ${item.number}</div>
                    <div class="meaning"><strong>${item.meaning.title}</strong><br>${item.meaning.desc}</div>
                `;
                meaningsDiv.appendChild(meaningDiv);
            });
            
            // 행운 팁 표시
            const tipsList = document.getElementById('lucky-tips-list');
            tipsList.innerHTML = '';
            // luckyTips는 이제 백엔드에서 온 데이터
            luckyTips.forEach(tip => { 
                const li = document.createElement('li');
                li.textContent = tip;
                tipsList.appendChild(li);
            });
            
            // 카카오톡 공유 내용 설정
            kakaoShareButton.onclick = () => {
                shareToKakao(luckyNumbers);
            };
        }

        // 카카오톡 공유 함수 (기존 코드 그대로 유지)
        function shareToKakao(numbers) {
            if (Kakao && Kakao.isInitialized()) {
                const birthdateText = `${new Date(userBirthDate).getFullYear()}년 ${new Date(userBirthDate).getMonth() + 1}월 ${new Date(userBirthDate).getDate()}일생`;
                const numbersText = numbers.join(', ');
                const descriptionText = `${birthdateText} 당신의 행운 숫자: ${numbersText}! 지금 SmartPick에서 확인해보세요.`;

                Kakao.Share.sendDefault({
                    objectType: 'feed',
                    content: {
                        title: '🎂 생년월일로 알아보는 나의 행운 로또 숫자!',
                        description: descriptionText,
                        imageUrl: 'https://smartpick.wow-daddy.com/images/og_birthday.png', // OG 이미지 URL
                        link: {
                            mobileWebUrl: 'https://smartpick.wow-daddy.com/birthday-lotto-test',
                            webUrl: 'https://smartpick.wow-daddy.com/birthday-lotto-test',
                        },
                    },
                    buttons: [
                        {
                            title: '나의 행운 숫자 확인하기',
                            link: {
                                mobileWebUrl: 'https://smartpick.wow-daddy.com/birthday-lotto-test',
                                webUrl: 'https://smartpick.wow-daddy.com/birthday-lotto-test',
                            },
                        },
                    ],
                });
            } else {
                alert('카카오 SDK가 초기화되지 않았습니다. 잠시 후 다시 시도해주세요.');
            }
        }

        // 이벤트 리스너
        analyzeButton.addEventListener('click', analyzeNumbers);

        // 페이지 로드 시
        document.addEventListener('DOMContentLoaded', () => {
            // 초기 로딩 시 date input에 오늘 날짜 기본 설정
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0'); // January is 0!
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('birthdate').value = `${yyyy}-${mm}-${dd}`;
        });
    </script>
</body>
</html>
