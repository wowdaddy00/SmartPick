<body>

    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <script>
        // 카카오 SDK 초기화
        // YOUR_KAKAO_JS_KEY는 app.py에서 kakao_js_key 변수로 전달되어야 합니다.
        if (Kakao && !Kakao.isInitialized()) {
            Kakao.init('{{ kakao_js_key }}');
        }

        const inputScreen = document.getElementById('input-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const resultScreen = document.getElementById('result-screen');
        const analyzeButton = document.getElementById('analyze-button');
        const kakaoShareButton = document.getElementById('kakao-share-button');
        
        let userBirthDate = '';
        let userGender = '';
        let luckyNumbers = [];
        let analysisResult = '';

        // 숫자학 분석 함수
        function calculateLuckyNumbers(birthDate, gender) {
            const date = new Date(birthDate);
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            
            // 생년월일 각 자리수 분석
            const yearDigits = year.toString().split('').map(Number);
            const monthDigits = month.toString().split('').map(Number);
            const dayDigits = day.toString().split('').map(Number);
            
            // 기본 행운 숫자 계산
            const lifePathNumber = calculateLifePath(year, month, day);
            const destinyNumber = calculateDestiny(yearDigits, monthDigits, dayDigits);
            const personalityNumber = calculatePersonality(month, day);
            
            // 6개 행운 숫자 생성
            const numbers = [];
            numbers.push(lifePathNumber);
            numbers.push(destinyNumber);
            numbers.push(personalityNumber);
            numbers.push(calculateSpecialNumber(year, month));
            numbers.push(calculateBirthMonthLucky(month, day));
            numbers.push(calculateFinalLucky(year, month, day, gender));
            
            // 1-45 범위로 조정하고 중복 제거
            // 숫자가 1~45 범위를 벗어나면 %45 연산 후 1 더하기
            // 중복 제거 후 6개 미만이면 무작위 숫자 추가
            const adjustedNumbers = numbers.map(num => ((num - 1) % 45) + 1);
            let uniqueNumbers = [...new Set(adjustedNumbers)];
            
            while (uniqueNumbers.length < 6) {
                const randomNum = ((Math.random() * 45) + 1); // 1-45 사이 난수
                if (!uniqueNumbers.includes(randomNum)) {
                    uniqueNumbers.push(randomNum);
                }
            }
            return uniqueNumbers.slice(0, 6).sort((a, b) => a - b); // 오름차순 정렬
        }
        
        function calculateLifePath(year, month, day) {
            let sum = year + month + day;
            while (sum > 45 && sum > 9) { // 45를 넘지 않도록, 두 자리 이상일 경우 반복
                sum = sum.toString().split('').map(Number).reduce((a, b) => a + b, 0);
            }
            return sum;
        }
        function calculateDestiny(yearDigits, monthDigits, dayDigits) {
            const allDigits = [...yearDigits, ...monthDigits, ...dayDigits];
            let sum = allDigits.reduce((a, b) => a + b, 0);
            while (sum > 45 && sum > 9) {
                sum = sum.toString().split('').map(Number).reduce((a, b) => a + b, 0);
            }
            return sum;
        }
        function calculatePersonality(month, day) {
            let sum = month + day;
            while (sum > 45 && sum > 9) {
                sum = sum.toString().split('').map(Number).reduce((a, b) => a + b, 0);
            }
            return sum;
        }
        function calculateSpecialNumber(year, month) {
            let sum = year + month;
            while (sum > 45 && sum > 9) {
                sum = sum.toString().split('').map(Number).reduce((a, b) => a + b, 0);
            }
            return sum;
        }
        function calculateBirthMonthLucky(month, day) {
            let sum = month * 3 + day * 2;
            while (sum > 45 && sum > 9) {
                sum = sum.toString().split('').map(Number).reduce((a, b) => a + b, 0);
            }
            return sum;
        }
        function calculateFinalLucky(year, month, day, gender) {
            let base = year + month + day;
            if (gender === 'male') base += 7;
            if (gender === 'female') base += 3;
            while (base > 45 && base > 9) {
                base = base.toString().split('').map(Number).reduce((a, b) => a + b, 0);
            }
            return base;
        }

        // 숫자 의미 해석 (1-9의 기본 의미만 사용하고, 최종 번호는 1-45 범위 그대로 해석하도록 수정)
        function getNumberMeaning(number) {
            const meanings = {
                1: { title: "새로운 시작과 독립", desc: "강한 리더십과 독립적인 정신을 상징합니다. 새로운 도전에 용기를 가져보세요." },
                2: { title: "조화와 협력", desc: "관계에서의 균형과 협력을 나타냅니다. 주변 사람들과의 조화가 행운을 부를 거예요." },
                3: { title: "창의성과 표현", desc: "예술적 재능과 자유로운 표현을 의미합니다. 자신을 솔직하게 드러낼 때 좋은 기회가 찾아옵니다." },
                4: { title: "안정과 견고함", desc: "성실함과 꾸준함, 그리고 튼튼한 기반을 상징합니다. 계획적인 노력이 성공으로 이어질 거예요." },
                5: { title: "자유와 변화", desc: "새로운 경험과 변화를 추구하는 에너지를 나타냅니다. 틀을 벗어나 자유롭게 도전해 보세요." },
                6: { title: "사랑과 책임감", desc: "가족과 공동체에 대한 사랑과 책임감을 의미합니다. 주변을 돌보는 따뜻한 마음이 행운을 부르죠." },
                7: { title: "직관과 통찰력", desc: "깊은 통찰력과 직감을 상징합니다. 내면의 목소리에 귀 기울이고 신중하게 판단하세요." },
                8: { title: "성취와 풍요", desc: "목표 달성과 물질적, 정신적 풍요를 의미합니다. 당신의 노력이 큰 결실을 맺을 거예요." },
                9: { title: "완성과 봉사", desc: "완성도와 인류애, 그리고 타인을 위한 봉사정신을 나타냅니다. 나눔의 기쁨을 통해 더 큰 행운을 찾을 수 있습니다." }
            };
            
            // 번호를 1-9의 기본 의미로 매핑 (1-45 범위의 숫자도 1-9로 압축하여 해석)
            const baseMeaningNumber = ((number - 1) % 9) + 1;
            return meanings[baseMeaningNumber] || { title: "특별한 의미", desc: "당신만의 특별한 의미를 가진 숫자입니다." };
        }

        // 행운 팁 생성 (생년월일 및 계산된 행운 숫자 활용)
        function generateLuckyTips(birthDate, numbers) {
            const date = new Date(birthDate);
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const yearLastDigit = parseInt(date.getFullYear().toString().slice(-1)); // 연도의 마지막 자리

            const tips = [];

            // 생일 관련 팁
            tips.push(`🍀 ${month}월 ${day}일은 당신의 생일이 있는 특별한 날입니다. 새로운 시작을 계획하기 좋은 시기예요.`);
            
            // 숫자별 팁 (최소 3~5개)
            if (numbers.length > 0) {
                tips.push(`🍀 당신의 첫 번째 행운 숫자 ${numbers[0]}은(는) 새로운 기회를 가져다 줄 것입니다. 용기를 내세요!`);
                if (numbers.length > 1) {
                    tips.push(`🍀 숫자 ${numbers[1]}이(가) 의미하는 조화로운 관계를 통해 예상치 못한 도움을 받을 수 있어요.`);
                }
                if (numbers.length > 2) {
                    tips.push(`🍀 숫자 ${numbers[2]}에 주목해 보세요. 이 숫자가 포함된 물건이나 장소에서 긍정적인 에너지를 얻을 수 있습니다.`);
                }
                if (numbers.length > 3) {
                    tips.push(`🍀 이번 주 가장 행운이 따를 요일은 ${['일', '월', '화', '수', '목', '금', '토'][(numbers[3] % 7)]}요일입니다. 중요한 일은 이때 진행해 보세요.`);
                }
                if (numbers.length > 4) {
                    tips.push(`🍀 숫자 ${numbers[4]}가 포함된 금액이나 횟수에 주목해 보세요. 예상치 못한 행운이 따를 수 있습니다.`);
                }
            }

            // 추가적인 무작위 팁 (다양성을 위해)
            const additionalTips = [
                `🍀 오늘 아침에 가장 먼저 떠오른 번호에 집중해보세요.`,
                `🍀 주변에서 우연히 발견하는 숫자들(시계, 간판, 전화번호)이 당신에게 메시지를 보낼 수 있어요.`,
                `🍀 로또를 구매할 때는 마음을 편안히 가지고 긍정적인 기운을 불어넣으세요.`,
                `🍀 꿈 속에서 본 숫자가 있다면, 그것 또한 당신의 행운 번호일 수 있습니다.`,
                `🍀 가까운 사람과 함께 복권을 구매하는 것도 좋은 기운을 더합니다.`,
                `🍀 이번 달의 색깔인 ${['빨간', '주황', '노란', '초록', '파란', '남색', '보라', '핑크', '갈색', '검정', '흰색', '금색'][(month % 12)]}색 옷을 입거나 소품을 활용해 보세요.` // 월별 색상 (예시)
            ];
            // 중복 없이 2~3개 추가
            while (tips.length < 6 && additionalTips.length > 0) {
                const randomIndex = Math.floor(Math.random() * additionalTips.length);
                tips.push(additionalTips.splice(randomIndex, 1)[0]);
            }
            
            return tips.slice(0, 6); // 최대 6개의 팁 반환
        }

        // 로딩 단계 시뮬레이션
        async function showLoadingProcess() {
            const steps = [
                "생년월일 분석 중...",
                "숫자학 계산 중...",
                "개인 운세 해석 중...",
                "행운 요소 추출 중...",
                "최종 결과 생성 중..."
            ];
            
            const loadingStepElement = document.getElementById('loading-step');
            for (let i = 0; i < steps.length; i++) {
                loadingStepElement.textContent = steps[i];
                await new Promise(resolve => setTimeout(resolve, 800));
            }
        }

        // 분석 실행
        async function analyzeNumbers() {
            const birthDate = document.getElementById('birthdate').value;
            const gender = document.getElementById('gender').value;
            
            if (!birthDate) {
                alert('생년월일을 입력해주세요!');
                return;
            }
            
            userBirthDate = birthDate;
            userGender = gender;
            
            // 화면 전환
            inputScreen.style.display = 'none';
            loadingScreen.style.display = 'block';
            
            // 로딩 프로세스 시뮬레이션
            await showLoadingProcess();
            
            // 행운 숫자 계산
            luckyNumbers = calculateLuckyNumbers(birthDate, gender);
            
            // 결과 화면으로 전환
            loadingScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            
            // 결과 표시
            displayResults();
            
            // 광고 로드 (이미 async script로 head에 있으므로 별도 호출 필요 없음)
            // loadAds();
        }

        // 결과 표시
        function displayResults() {
            const date = new Date(userBirthDate);
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            
            // 생년월일 정보 표시
            document.getElementById('birth-info').textContent =
                `${year}년 ${month}월 ${day}일 생`;
            
            // 행운 숫자 표시
            const luckyNumbersDiv = document.getElementById('lucky-numbers');
            luckyNumbersDiv.innerHTML = '';
            luckyNumbers.forEach(num => {
                const ball = document.createElement('div');
                ball.className = 'lucky-ball';
                ball.textContent = num;
                luckyNumbersDiv.appendChild(ball);
            });
            
            // 숫자 의미 표시
            const meaningsDiv = document.getElementById('number-meanings');
            meaningsDiv.innerHTML = '';
            luckyNumbers.forEach(num => {
                const meaning = getNumberMeaning(num);
                const meaningDiv = document.createElement('div');
                meaningDiv.className = 'number-meaning';
                meaningDiv.innerHTML = `
                    <div class="number">숫자 ${num}</div>
                    <div class="meaning"><strong>${meaning.title}</strong><br>${meaning.desc}</div>
                `;
                meaningsDiv.appendChild(meaningDiv);
            });
            
            // 행운 팁 표시
            const tipsList = document.getElementById('lucky-tips-list');
            tipsList.innerHTML = '';
            const tips = generateLuckyTips(userBirthDate, luckyNumbers);
            tips.forEach(tip => {
                const li = document.createElement('li');
                li.textContent = tip;
                tipsList.appendChild(li);
            });
            
            // 카카오톡 공유 내용 설정
            kakaoShareButton.onclick = () => {
                shareToKakao(luckyNumbers);
            };
        }

        // 카카오톡 공유 함수
        function shareToKakao(numbers) {
            if (Kakao && Kakao.isInitialized()) {
                const birthdateText = `${new Date(userBirthDate).getFullYear()}년 ${new Date(userBirthDate).getMonth() + 1}월 ${new Date(userBirthDate).getDate()}일생`;
                const numbersText = numbers.join(', ');
                const descriptionText = `${birthdateText} 당신의 행운 숫자: ${numbersText}! 지금 SmartPick에서 확인해보세요.`;

                Kakao.Share.sendDefault({
                    objectType: 'feed',
                    content: {
                        title: '🎂 생년월일로 알아보는 나의 행운 로또 숫자!',
                        description: descriptionText,
                        imageUrl: 'https://smartpick.wow-daddy.com/images/og_birthday.png', // OG 이미지 URL
                        link: {
                            mobileWebUrl: 'https://smartpick.wow-daddy.com/birthday-lotto-test',
                            webUrl: 'https://smartpick.wow-daddy.com/birthday-lotto-test',
                        },
                    },
                    buttons: [
                        {
                            title: '나의 행운 숫자 확인하기',
                            link: {
                                mobileWebUrl: 'https://smartpick.wow-daddy.com/birthday-lotto-test',
                                webUrl: 'https://smartpick.wow-daddy.com/birthday-lotto-test',
                            },
                        },
                    ],
                });
            } else {
                alert('카카오 SDK가 초기화되지 않았습니다. 잠시 후 다시 시도해주세요.');
            }
        }

        // 이벤트 리스너
        analyzeButton.addEventListener('click', analyzeNumbers);

        // 페이지 로드 시
        document.addEventListener('DOMContentLoaded', () => {
            // 초기 로딩 시 date input에 오늘 날짜 기본 설정
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0'); // January is 0!
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('birthdate').value = `${yyyy}-${mm}-${dd}`;
        });
    </script>
