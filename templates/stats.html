    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family:'Pretendard', Arial, sans-serif;
            background:#f8fafd;
            margin:0;
            display: flex; /* body를 flex 컨테이너로 만들어 중앙 정렬 */
            justify-content: center;
            align-items: center; /* 수직 중앙 정렬 (이로 인해 콘텐츠가 상단에 붙지 않을 수 있음) */
            min-height: 100vh; /* 최소 높이를 뷰포트 높이로 설정 */
            flex-direction: column; /* 세로로 아이템 배치 */
        }
        /* 중앙 콘텐츠 영역을 감싸는 새로운 래퍼 */
        .page-wrapper {
            width: 100%;
            max-width: 650px; /* .container와 동일하게 최대 너비 설정 */
            margin: 20px auto; /* 상하 여백, 좌우 중앙 정렬 */
            box-sizing: border-box;
            padding: 0 10px; /* 양쪽 고정 광고를 위한 여백 (필요시 조정) */
        }
        .container {
            width: 100%; /* 부모 .page-wrapper에 맞춰 너비 사용 */
            /* max-width는 .page-wrapper에서 담당 */
            margin: 0 auto; /* 좌우 중앙 정렬 */
            background:#fff;
            border-radius:2em;
            box-shadow:0 6px 36px #22325620;
            padding:2.8em 2em 2.2em 2em;
            text-align:center;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        h1 { font-size:2em; margin-bottom:1.3em;}
        .desc { color:#666; margin-bottom:2.2em;}
        .highlight { font-weight:bold; color:#4361ee;}
        canvas {
            margin:1em 0 2em 0;
            width: 100% !important;
            height: 300px !important;
            max-height: 400px;
        }
        /* 광고 컨테이너 스타일 */
        .ad-container-for-stats {
            width: 100%; /* 부모 .page-wrapper에 맞춰 너비 사용 */
            /* max-width는 .page-wrapper에서 담당 */
            margin: 40px auto; /* 위아래 여백, 좌우 중앙 정렬 */
            text-align: center;
            box-sizing: border-box;
            /* padding: 0 20px; 이전에는 .ad-container-for-stats에 있었으나,
                           이제는 .page-wrapper에 패딩을 줘서 중복을 피함 */
        }
        
        /* 모바일 반응형 */
        @media (max-width: 500px) {
            .page-wrapper {
                margin: 10px auto;
                padding: 0 5px; /* 모바일에서 여백 더 줄임 */
            }
            .container {
                padding: 2em 1.5em;
            }
            h1 { font-size: 1.8em; }
            .desc { font-size: 0.9em; }
            canvas {
                height: 250px !important;
            }
            .ad-container-for-stats {
                margin: 20px auto; /* 모바일에서 마진 조정 */
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper"> {# <-- 새로운 래퍼 추가 #}
        <div class="container">
            <h1>로또 번호 <span class="highlight">통계</span></h1>
            <p class="desc">최근 <span class="highlight">{{ recent_n }}</span>회차 당첨번호의 출현 빈도 분석</p>
            <canvas id="frequencyChart"></canvas>
            <div id="noDataMessage" style="display: none; color: red; margin-top: 20px;">
                통계 데이터를 불러올 수 없거나 데이터가 비어있습니다. 잠시 후 다시 시도해주세요.
            </div>
        </div>

        <input type="hidden" id="freqDataInput" value="{{ freq_data_encoded }}">
    
    <script>
        
        // 숨겨진 input 필드에서 Base64 인코딩된 문자열을 가져와 디코딩 및 파싱
        const encodedFreqDataString = document.getElementById('freqDataInput').value;
        let freqData = {};
        try {
            // Base64 디코딩
            const decodedFreqDataString = atob(encodedFreqDataString);
            freqData = JSON.parse(decodedFreqDataString);
            console.log("Parsed freqData:", freqData); // 디버깅용
        } catch (e) {
            console.error("Error parsing freqData from hidden input:", e);
            console.log("Raw encodedFreqDataString:", encodedFreqDataString); // 디버깅용
            // 파싱 실패 시 빈 객체로 초기화하여 오류 방지
            freqData = {};
        }

        const recentN = {{ recent_n }};

        // 데이터 유효성 검사
        const hasMeaningfulData = freqData && Object.keys(freqData).some(key => freqData[key] > 0);
        console.log("hasMeaningfulData:", hasMeaningfulData); // 디버깅용

        if (hasMeaningfulData) {
            const labels = Object.keys(freqData);
            const data = Object.values(freqData);

            const maxYValue = Math.max(...data);
            const suggestedMaxY = maxYValue > 0 ? maxYValue + 1 : 1;

            const ctx = document.getElementById('frequencyChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `최근 ${recentN}회차 출현 빈도`,
                        data: data,
                        backgroundColor: 'rgba(67, 97, 238, 0.7)',
                        borderColor: 'rgba(67, 97, 238, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '출현 횟수'
                            },
                            max: suggestedMaxY
                        },
                        x: {
                            title: {
                                display: true,
                                text: '로또 번호'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `번호 ${context.label}: ${context.raw}회`;
                                }
                            }
                        }
                    }
                }
            });
        } else {
            // 데이터가 없거나 유효하지 않을 경우 메시지 표시
            document.getElementById('frequencyChart').style.display = 'none';
            document.getElementById('noDataMessage').style.display = 'block';
        }
    </script>

    <div class="ad-container-for-stats">

            data-full-width-responsive="true"></ins> {# "true" 또는 "false"로 설정 (레이아웃에 따라) #}
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>
