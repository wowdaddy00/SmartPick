<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2748658493247983" crossorigin="anonymous"></script>
    <title>SmartPick 로또 번호 통계 - 최신 출현 빈도 분석</title>
    <link rel="canonical" href="https://smartpick.wow-daddy.com/stats" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SmartPick 로또 번호 통계 페이지에서 최근 회차 로또 번호의 출현 빈도를 확인하고 분석하세요.">
    <meta name="keywords" content="로또 통계, 로또 분석, 로또 빈도, 로또 번호, 로또 당첨 번호, SmartPick">
    <meta name="author" content="SmartPick Team">

    <meta property="og:title" content="SmartPick 로또 번호 통계 - 최신 출현 빈도 분석" />
    <meta property="og:description" content="최신 로또 번호 통계와 출현 빈도를 그래프로 한눈에 확인하세요." />
    <meta property="og:image" content="https://smartpick.wow-daddy.com/images/og_smartpick.png" />
    <meta property="og:url" content="https://smartpick.wow-daddy.com/stats" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SmartPick 로또 번호 통계 - 최신 출현 빈도 분석" />
    <meta name="twitter:description" content="로또 통계 페이지에서 번호별 출현 빈도를 확인하고 나만의 전략을 세워보세요!" />
    <meta name="twitter:image" content="https://smartpick.wow-daddy.com/images/og_smartpick.png" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family:'Pretendard', Arial, sans-serif; 
            background:#f8fafd; 
            margin:0;
            display: flex; /* body를 flex 컨테이너로 만들어 중앙 정렬 */
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* 최소 높이를 뷰포트 높이로 설정 */
        }
        .container { 
            max-width:650px; 
            margin:60px auto; 
            background:#fff; 
            border-radius:2em; 
            box-shadow:0 6px 36px #22325620; 
            padding:2.8em 2em 2.2em 2em; 
            text-align:center;
            min-height: 400px; /* 컨테이너의 최소 높이 설정 */
            display: flex; /* 내부 요소 정렬을 위해 flex 사용 */
            flex-direction: column; /* 세로 방향 정렬 */
            justify-content: center; /* 세로 중앙 정렬 */
            align-items: center; /* 가로 중앙 정렬 */
            box-sizing: border-box; /* 패딩이 너비에 포함되도록 */
            width: 90%; /* 반응형 너비 */
        }
        h1 { font-size:2em; margin-bottom:1.3em;}
        .desc { color:#666; margin-bottom:2.2em;}
        .highlight { font-weight:bold; color:#4361ee;}
        canvas { 
            margin:1em 0 2em 0;
            width: 100% !important; /* 너비를 부모에 맞춤 */
            height: 300px !important; /* 명시적인 높이 설정 (필요에 따라 조절) */
            max-height: 400px; /* 최대 높이 설정 */
        }
        /* 모바일 반응형 */
        @media (max-width: 500px) {
            .container {
                margin: 30px auto; /* 모바일에서 마진 조정 */
                padding: 2em 1.5em;
            }
            h1 { font-size: 1.8em; }
            .desc { font-size: 0.9em; }
            canvas {
                height: 250px !important; /* 모바일에서 캔버스 높이 조정 */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>로또 번호 <span class="highlight">통계</span></h1>
        <p class="desc">최근 <span class="highlight">{{ recent_n }}</span>회차 당첨번호의 출현 빈도 분석</p>
        <canvas id="frequencyChart"></canvas>
        <!-- 데이터가 없을 때 표시될 메시지 영역 -->
        <div id="noDataMessage" style="display: none; color: red; margin-top: 20px;">
            통계 데이터를 불러올 수 없거나 데이터가 비어있습니다. 잠시 후 다시 시도해주세요.
        </div>
    </div>

    <!-- Flask에서 전달된 freq_json 데이터를 JavaScript에서 안전하게 파싱하기 위한 숨겨진 input 필드 -->
    <input type="hidden" id="freqDataInput" value="{{ freq_json | tojson | safe }}">

    <script>
        // 숨겨진 input 필드에서 JSON 문자열을 가져와 파싱
        const freqDataString = document.getElementById('freqDataInput').value;
        let freqData = {};
        try {
            freqData = JSON.parse(freqDataString);
        } catch (e) {
            console.error("Error parsing freqData from hidden input:", e);
            console.log("Raw freqDataString:", freqDataString);
            // 파싱 실패 시 빈 객체로 초기화하여 오류 방지
            freqData = {}; 
        }
        
        const recentN = {{ recent_n }};

        // 데이터 유효성 검사
        // freqData가 비어있거나, 모든 값이 0인 경우를 처리
        const hasMeaningfulData = freqData && Object.keys(freqData).some(key => freqData[key] > 0);

        if (hasMeaningfulData) {
            const labels = Object.keys(freqData);
            const data = Object.values(freqData);

            // Y축의 최대값을 동적으로 설정 (데이터의 최대값에 따라)
            // 만약 모든 데이터가 0이라면, max 값을 1로 설정하여 빈 그래프가 보이지 않도록 함
            const maxYValue = Math.max(...data);
            const suggestedMaxY = maxYValue > 0 ? maxYValue + 1 : 1; // 최소 1 이상

            const ctx = document.getElementById('frequencyChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `최근 ${recentN}회차 출현 빈도`,
                        data: data,
                        backgroundColor: 'rgba(67, 97, 238, 0.7)', // #4361ee
                        borderColor: 'rgba(67, 97, 238, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, // 컨테이너에 맞춰 크기 조정
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '출현 횟수'
                            },
                            // Y축 최대값 동적 설정
                            max: suggestedMaxY 
                        },
                        x: {
                            title: {
                                display: true,
                                text: '로또 번호'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `번호 ${context.label}: ${context.raw}회`;
                                }
                            }
                        }
                    }
                }
            });
        } else {
            // 데이터가 없거나 유효하지 않을 경우 메시지 표시
            document.getElementById('frequencyChart').style.display = 'none'; // 캔버스 숨기기
            document.getElementById('noDataMessage').style.display = 'block'; // 메시지 표시
        }
    </script>
</body>
</html>
