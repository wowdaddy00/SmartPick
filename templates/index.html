  {# 외부 style.css 파일을 링크하여 모든 스타일을 통합 관리합니다. #}

<body class="main-page-layout"> {# <--- body에 'main-page-layout' 클래스 추가 #}

    <b>누적 추천 조합:</b> {{ total_recs_count if total_recs_count is not none else '불러오는 중...' }}건

            {% for n in winning_nums %}

            {% endfor %}
            <span class="plus-sign">+</span>
            <span class="ball n{{ (bonus_num-1)//10 + 1 }}">{{ bonus_num }}</span>
        </div>
    </div>
    {% endif %}

    <div class="usp-message">
        <div class="line1"><i class="fas fa-exclamation-triangle icon"></i><br>지금까지 1등 당첨번호가<br>다시 나온 적이 없습니다.</div>
        <div class="line2"><i class="fas fa-check-circle icon"></i>SmartPick은 과거 당첨번호를<br>**학습하여**제외하고<br>무료로 추천해 드립니다!</div>
    </div>

    {# .link-item 클래스는 제거하고, .link-about-moved 클래스만 사용합니다. #}
    <a href="/about" class="link-about-moved"> {# <--- 클래스 변경 유지 #}
        <i class="fas fa-info-circle icon"></i> SmartPick이 특별한 이유 알아보기
    </a>

    <form method="post" style="width: 100%;">
      <button type="submit"> 프리미엄 번호<br>추천 받기</button>
    </form>

    <a href="/choose_recommendation" class="main-action-link-button">
        고급 맞춤 번호<br>추천 받기
    </a>

    <a href="/fun-lotto-test" class="main-action-link-button">
        <i class="fas fa-dice icon"></i> 재미로 보는<br>로또 테스트
    </a>

    <a href="/faq" class="main-action-link-button" style="background: linear-gradient(135deg, #a8e0f5 0%, #6a82fb 100%);">
        <i class="fas fa-question-circle icon"></i> 자주 묻는 질문<br>(FAQ)
    </a>                                            
                                                

    {% if numbers %}
      <div class="lotto" id="lotto_result">
        {% for n in numbers[0] %}
          <span class="ball n{{ (n-1)//10 + 1 }}">{{ n }}</span>
        {% endfor %}
      </div>
      <button class="copy-btn" onclick="copyLotto()">추천 번호 복사</button>
      <button class="main-action-link-button" onclick="generateLottoStory()">
          재미로 보는<br>로또 당첨 후<br>내 모습 확인하기!
      </button>

      <div id="story-loading-indicator" style="display: none; margin-top: 1em; color: #555;">
          <i class="fas fa-spinner fa-spin"></i> 스토리 생성 중...
      </div>
      <div id="lotto-story" style="margin-top: 1em; padding: 1em; border: 1px solid #ddd; border-radius: 10px; background-color: #f9f9f9; text-align: left; color: #333; font-size: 1em; line-height: 1.6;">
          </div>

      <script>
        function copyLotto() {
          let txt = Array.from(document.querySelectorAll('#lotto_result .ball')).map(e => e.textContent).join(', ');
          const tempTextArea = document.createElement('textarea');
          tempTextArea.value = txt;
          document.body.appendChild(tempTextArea);
          tempTextArea.select();
          document.execCommand('copy');
          document.body.removeChild(tempTextArea);

          const msgBox = document.createElement('div');
          msgBox.textContent = "복사 완료: " + txt;
          msgBox.style.cssText = `
              position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
              background-color: #4CAF50; color: white; padding: 15px 20px;
              border-radius: 10px; z-index: 1000; opacity: 0; transition: opacity 0.5s;
          `;
          document.body.appendChild(msgBox);
          setTimeout(() => msgBox.style.opacity = 1, 10);
          setTimeout(() => {
              msgBox.style.opacity = 0;
              msgBox.addEventListener('transitionend', () => msgBox.remove());
          }, 2000);
        }

        async function generateLottoStory() {
            const storyDiv = document.getElementById('lotto-story');
            const loadingIndicator = document.getElementById('story-loading-indicator');
            const recommendedNumbers = Array.from(document.querySelectorAll('#lotto_result .ball')).map(e => parseInt(e.textContent));

            storyDiv.textContent = '';
            loadingIndicator.style.display = 'block';

            try {
                const response = await fetch('/generate_lotto_story', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ numbers: recommendedNumbers })
                });

                const data = await response.json();

                if (response.ok) {
                    storyDiv.textContent = data.story;
                } else {
                    storyDiv.textContent = '스토리 생성 실패: ' + (data.error || '알 수 없는 오류');
                    storyDiv.style.color = 'red';
                }
            } catch (error) {
                console.error('스토리 생성 중 오류 발생:', error);
                storyDiv.textContent = '스토리 생성 중 네트워크 오류가 발생했습니다.';
                storyDiv.style.color = 'red';
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }
      </script>
    {% endif %}
  </div> {# .container 끝 #}
