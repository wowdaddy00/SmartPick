    <style>
        /* 중요: body 스타일은 static/style.css에 있으므로 여기서는 제거합니다. */
        /* main 컨테이너에 중앙 정렬을 위한 display:flex 속성을 추가합니다. */
        main {
            max-width: 600px;
            margin: 2rem auto;
            padding: 1rem;
            background-color: #fff8f4;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            /* 중앙 정렬을 위해 main 자체를 flex 컨테이너로 만듭니다. */
            display: flex; /* 추가 */
            flex-direction: column; /* 세로 정렬 */
            align-items: center; /* 가로 중앙 정렬 */
            text-align: center; /* 내부 텍스트 중앙 정렬 */
            box-sizing: border-box;
            width: 90%;
        }
        /* 제목 스타일 */
        main h2 {
            font-size: 2em;
            color: #d32f2f;
            margin-bottom: 1em;
            width: 100%; /* 너비 100%로 설정 */
        }
        /* 안내 문구 스타일 */
        main p {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 1.5em;
            width: 100%; /* 너비 100%로 설정 */
        }
        /* 1. 꿈 입력칸 사이즈 고정 및 여백 추가 */
        textarea {
            height: 120px; /* 고정 높이 */
            width: 100%
            padding: 1em; /* 내부 여백 */
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: none; /* 크기 조절 막음 */
            box-sizing: border-box; /* 패딩이 너비/높이에 포함되도록 */
        }

        /* 폼 자체를 flex 컨테이너로 만들어 내부 요소들을 중앙 정렬 */
        form {
            width: 100%; /* 폼이 main의 100% 너비를 차지하게 */
            display: flex; /* flex 컨테이너로 만듭니다. */
            flex-direction: column; /* 자식 요소를 세로로 정렬합니다. */
            align-items: center; /* 자식 요소를 가로 중앙으로 정렬합니다. */
            margin-bottom: 2em; /* 이전과 동일한 여백 유지 */
        }

        /* 제출 버튼 스타일 */
        .submit-btn {
            background-color: #f44336;
            color: white;
            padding: 1em 2em;
            border: none;
            border-radius: 1em;
            margin-top: 1rem; /* textarea와의 간격 */
            cursor: pointer;
            font-weight: bold;
            font-size: 1em; /* 글자 크기 조절 (원하는 크기로 변경) */
            width: calc(100% - 2em); /* 하단 버튼과 통일 */
            max-width: 300px; /* 최대 너비도 동일하게 */
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3);
            text-align: center;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .submit-btn:hover {
            background-color: #d32f2f;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(244, 67, 54, 0.4);
        }
        /* 결과 박스 스타일 */
        .result-box {
            margin-top: 2rem;
            background-color: #fff0ec;
            border: 1px solid #ffccbc;
            border-radius: 10px;
            padding: 1.5rem;
            text-align: left;
            line-height: 1.8;
            color: #333;
            font-size: 1.05em;
            width: calc(100% - 3rem); /* padding을 고려한 너비 조정 */
            margin: 2rem auto; /* 중앙 정렬 */
            /* 3. 해몽 기반 번호의 로또볼과 메인 페이지로 돌아가기 탭 사이 간격 */
            /* 이 부분은 result-box의 margin-bottom으로 조정합니다. */
        }
        /* 로딩 인디케이터 스타일 */
        .loading-indicator {
            margin-top: 2rem;
            font-size: 1.2em;
            color: #6a82fb;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%; /* 너비 100%로 설정 */
        }
        .loading-indicator .fas {
            margin-right: 10px;
        }

        /* 로또 볼 스타일 */
        .lotto-balls-display {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 1em;
            /* 3. 로또볼 아래 간격 추가 */
            margin-bottom: 1.5em; /* 충분한 간격 확보 */
            width: 100%; /* 너비 100%로 설정 */
        }
        .lotto-ball {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 42px;
            height: 42px;
            min-width: 42px;
            min-height: 42px;
            border-radius: 50%;
            font-size: 1.2em;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            border: 3px solid #fff;
            color: #333;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        /* 볼 색상 (index.html에서 가져옴) */
        .lotto-ball.n1 { background: #ffdf6c; } /* 1-10 노란색 */
        .lotto-ball.n2 { background: #9bd0ff; } /* 11-20 파란색 */
        .lotto-ball.n3 { background: #ff91a5; color: #fff;} /* 21-30 빨간색 */
        .lotto-ball.n4 { background: #c2c9d1; } /* 31-40 회색 */
        .lotto-ball.n5 { background: #b0e891; } /* 41-45 초록색 */

        /* 메인 페이지로 돌아가기 버튼 스타일 */
        .back-to-home {
            display: block; /* 블록 요소로 만들어 중앙 정렬 용이하게 */
            padding: 1em 2em;
            background: linear-gradient(135deg, #6a82fb 0%, #3f5477 100%);
            color: #fff;
            border-radius: 1em;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(70, 96, 216, 0.3);
            transition: all 0.3s ease;
            margin-top: 2rem; /* 충분한 상단 여백 추가 (결과 박스와 간격) */
            max-width: 300px; /* 버튼의 최대 너비 */
            width: calc(100% - 2em); /* 패딩 고려한 너비 */
            box-sizing: border-box;
            text-align: center;
            margin-left: auto; /* 중앙 정렬 */
            margin-right: auto; /* 중앙 정렬 */
        }
        .back-to-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(70, 96, 216, 0.4);
        }

        /* 모바일 반응형 */
        @media (max-width: 600px) {
            main {
                margin: 1rem auto;
                padding: 1rem;
                width: 95%;
            }
            main h2 {
                font-size: 1.6em;
            }
            main p {
                font-size: 1em;
            }
            textarea {
                width: calc(100% - 1.5em); /* 모바일 패딩 고려 */
                padding: 0.75em;
                height: 120px; /* 모바일에서 고정 높이 조정 */
            }
            .submit-btn {
                font-size: 1em;
                padding: 8px 15px;
                min-width: unset; /* 모바일에서 최소 너비 해제 */
                width: calc(100% - 1.5em); /* 모바일에서 버튼 너비를 폼에 맞게 */
                margin-top: 0.75rem; /* 모바일에서 여백 조정 */
            }
            .result-box {
                padding: 1em;
                font-size: 0.95em;
                margin-bottom: 1.5rem; /* 모바일 결과 박스 하단 여백 조정 */
            }
            .lotto-balls-display {
                gap: 5px;
                margin-bottom: 1em; /* 모바일 로또볼 아래 간격 조정 */
            }
            .lotto-ball {
                width: 36px;
                height: 36px;
                min-width: 36px;
                min-height: 36px;
                font-size: 1em;
                border-width: 2px;
            }
            .loading-indicator {
                font-size: 1em;
            }
            .back-to-home {
                padding: 0.8em 1.5em;
                font-size: 1em;
                margin-top: 1em; /* 모바일 메인페이지 돌아가기 버튼 상단 여백 조정 */
                max-width: unset; /* 모바일에서 최대 너비 해제 */
                width: calc(100% - 1.5em); /* 모바일에서 너비 조정 */
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h2>⛅️ 꿈 해몽 로또 번호 추천</h2>
        <p>생생한 꿈을 입력해주세요. AI가 꿈을 해몽하고 행운의 로또 번호를 추천해 드립니다. (최대 300자)</p>

        <form id="dreamForm">
            <textarea id="dreamInput" maxlength="300" placeholder="예: 호랑이를 타고 낮은 산을 넘고, 굶주린 시간을 보면서 도와준 이가 있어요."></textarea>
            <button type="submit" class="submit-btn">⭐ 꿈 해몽하고 번호 받기</button>
        </form>

        <div id="loading-indicator" class="loading-indicator" style="display:none;">
            <i class="fas fa-spinner fa-spin"></i> 꿈 해몽 중... 잠시만 기다려 주세요.
        </div>

        <div id="result" class="result-box" style="display:none;">
            </div>

        <div style="margin: 2rem 0;">
          <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-2748658493247983"
            data-ad-slot="1322588827"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
          <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
          </script>
        </div>
        
        <a href="/" class="back-to-home">메인 페이지로 돌아가기</a>
    </main>
    {# 푸터는 static/style.css에서 공통 스타일을 가집니다. #}
    <footer>
        <p>&copy; {{ now.year if now and now.year else '현재 연도' }} SmartPick. All rights reserved.</p>
        <div>
            <a href="/privacy">개인정보처리방침</a> |
            <a href="/disclaimer">면책조항</a> |
            <a href="/contact">문의</a>
        </div>
    </footer>

    <script>
        const form = document.getElementById('dreamForm');
        const input = document.getElementById('dreamInput');
        const resultDiv = document.getElementById('result'); // 변수명 변경
        const loadingIndicator = document.getElementById('loading-indicator'); // 로딩 인디케이터

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            resultDiv.style.display = 'none'; // 결과 숨기기
            loadingIndicator.style.display = 'flex'; // 로딩 표시

            const response = await fetch('/api/dream-to-lotto', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ dream: input.value })
            });

            const data = await response.json();
            loadingIndicator.style.display = 'none'; // 로딩 숨기기

            if (data.error) {
                resultDiv.innerHTML = `<strong>\u26a0\ufe0f 오류:</strong> ${data.error}`; // HTML에 맞게 innerHTML
                resultDiv.style.color = 'red';
            } else {
                resultDiv.style.color = '#333'; // 에러 시 변경될 수 있는 색상 원래대로
                // 로또 볼 생성 함수 (index.html의 볼 색상 로직 활용)
                function createLottoBallsHtml(numbers) {
                    let ballsHtml = '<div class="lotto-balls-display">';
                    numbers.forEach(n => {
                        const ballClass = `n${Math.floor((n - 1) / 10) + 1}`; // 1-10:n1, 11-20:n2...
                        ballsHtml += `<span class="lotto-ball ${ballClass}">${n}</span>`;
                    });
                    ballsHtml += '</div>';
                    return ballsHtml;
                }

                const lottoBallsHtml = createLottoBallsHtml(data.numbers);

                resultDiv.innerHTML = `
                    <strong>\u2728 해몽:</strong> ${data.story}<br>
                    <strong>\ud83c\udfb2 해몽 기반 번호:</strong>
                    ${lottoBallsHtml}
                `;
            }
            resultDiv.style.display = 'block';
        });
    </script>
</body>
</html>
