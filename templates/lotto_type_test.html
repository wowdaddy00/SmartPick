<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple HTML App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #1a202c;
            margin-bottom: 24px;
            font-size: 2.25rem; /* text-4xl */
            font-weight: 700; /* font-bold */
        }
        p {
            color: #4a5568;
            margin-bottom: 32px;
            font-size: 1.125rem; /* text-lg */
        }
        .button {
            background-color: #4c51bf; /* indigo-700 */
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1.125rem; /* text-lg */
            font-weight: 600; /* font-semibold */
            text-decoration: none;
            transition: background-color 0.3s ease;
            display: inline-block;
            cursor: pointer;
            border: none;
        }
        .button:hover {
            background-color: #363b8c; /* indigo-800 */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Your App!</h1>
        <p>This is a simple HTML application demonstrating a clean and responsive design using Tailwind CSS. Click the button below to see an action.</p>
        <button class="button" onclick="showMessage()">Click Me</button>
        <div id="messageBox" class="mt-8 p-4 bg-blue-100 text-blue-800 rounded-lg hidden">
            Hello from your app! This message appeared on click.
        </div>
    </div>

    <script>
        /**
         * Displays a message box when the button is clicked.
         * Toggles the visibility of the message box.
         */
        function showMessage() {
            const messageBox = document.getElementById('messageBox');
            messageBox.classList.toggle('hidden');
        }
    </script>
</body>
</html>
