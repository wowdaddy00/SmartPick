        let shareButtonElement;

        const resultTypeElement = document.getElementById('result-type');
        const resultDescriptionElement = document.getElementById('result-description');
        const lottoDnaNumbersElement = document.getElementById('lotto-dna-numbers'); // ID 변경

        // 모든 함수를 window 객체에 할당하여 전역적으로 접근 가능하게 함
        window.startTest = function() {
            startScreen.style.display = 'none';
            questionScreen.style.display = 'block';
            currentQuestionIndex = 0;
            totalScore = 0;
            loadQuestion();
            // 로그 이벤트: 테스트 시작
            window.logEventToBackend('dna_test_start', { user_ip: '{{ request.remote_addr }}' });
        }

        function loadQuestion() {
            if (selectedOptionCardElement) {
                selectedOptionCardElement.classList.remove('selected');
                selectedOptionCardElement = null;
            }
            selectedOptionForCurrentQuestion = null;

            optionsContainer.innerHTML = '';
            nextButtonElement.style.display = 'none'; // 수정된 변수명 사용
            showResultButtonElement.style.display = 'none'; // 수정된 변수명 사용

            if (currentQuestionIndex < questions.length) {
                const q = questions[currentQuestionIndex];
                questionTextElement.textContent = q.question;
                
                q.options.forEach((option, index) => {
                    const optionCard = document.createElement('div');
                    optionCard.classList.add('option-card');
                    optionCard.textContent = option.text;
                    optionCard.onclick = () => selectOption(option.score, optionCard); 
                    optionsContainer.appendChild(optionCard);
                });
            } else {
                window.showResult(); // 모든 질문 완료 시 결과 보기
            }
        }

        function selectOption(score, clickedCard) {
            if (selectedOptionCardElement) {
                selectedOptionCardElement.classList.remove('selected');
            }

            clickedCard.classList.add('selected');
            selectedOptionCardElement = clickedCard;
            selectedOptionForCurrentQuestion = { score: score };

            if (currentQuestionIndex === questions.length - 1) {
                showResultButtonElement.style.display = 'flex'; // 수정된 변수명 사용
                nextButtonElement.style.display = 'none'; // 수정된 변수명 사용
            } else {
                nextButtonElement.style.display = 'flex'; // 수정된 변수명 사용
                showResultButtonElement.style.display = 'none'; // 수정된 변수명 사용
            }
        }

        window.nextQuestion = function() {
            if (selectedOptionForCurrentQuestion === null) {
                const msgBox = document.createElement('div');
                msgBox.textContent = '옵션을 선택해주세요!';
                msgBox.style.cssText = `
                    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                    background-color: var(--color-brick); 
                    color: white; padding: 15px 20px;
                    border-radius: 10px; z-index: 1000; opacity: 0; transition: opacity 0.5s;
                    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                `;
                document.body.appendChild(msgBox);
                setTimeout(() => msgBox.style.opacity = 1, 10);
                setTimeout(() => {
                    msgBox.style.opacity = 0;
                    msgBox.addEventListener('transitionend', () => msgBox.remove());
                }, 2000);
                return;
            }
            totalScore += selectedOptionForCurrentQuestion.score;
            currentQuestionIndex++;
            selectedOptionForCurrentQuestion = null;
            loadQuestion();
        }

        window.showResult = async function() {
            if (selectedOptionForCurrentQuestion) {
                totalScore += selectedOptionForCurrentQuestion.score;
            }

            questionScreen.style.display = 'none';
            resultScreen.style.display = 'block';

            let resultKey;
            if (totalScore >= 13) {
                resultKey = "13-15";
            } else if (totalScore >= 9) {
                resultKey = "9-12";
            } else {
                resultKey = "5-8";
            }

            const result = results[resultKey];
            resultTypeElement.textContent = result.type;
            resultDescriptionElement.textContent = result.description;

            // 로딩 인디케이터 표시 (로또 번호 가져오는 동안)
            lottoDnaNumbersElement.innerHTML = '<i class="fas fa-spinner fa-spin" style="font-size: 2em; color: var(--color-clear-day);"></i>';

            try {
                // 백엔드에서 로또 번호 가져오기
                const response = await fetch(`${window.location.origin}/generate_dna_lotto_numbers`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ dna_type: resultKey }) // DNA 유형 정보를 백엔드로 전송
                });

                const data = await response.json();

                if (response.ok && data.numbers) {
                    lottoDnaNumbersElement.innerHTML = ''; // 로딩 인디케이터 제거
                    const generatedNumbers = data.numbers.sort((a, b) => a - b); // 정렬

                    generatedNumbers.forEach((num) => {
                        const ball = document.createElement('span');
                        ball.classList.add('lotto-ball', getBallResultColor(num));
                        ball.textContent = num;
                        lottoDnaNumbersElement.appendChild(ball);
                    });
                } else {
                    lottoDnaNumbersElement.innerHTML = '<p style="color: red;">번호 생성 실패</p>';
                    console.error('Failed to get numbers from backend:', data.error);
                }
            } catch (error) {
                lottoDnaNumbersElement.innerHTML = '<p style="color: red;">번호 로딩 오류</p>';
                console.error('Error fetching lotto numbers:', error);
            }

            // 로그 이벤트: 테스트 결과 확인
            window.logEventToBackend('dna_test_result', { 
                user_ip: '{{ request.remote_addr }}', 
                total_score: totalScore, 
                result_type: result.type 
            });
        }

        function getBallResultColor(number) {
            if (number <= 10) return 'n1'; // Yellow
            if (number <= 20) return 'n2'; // Blue
            if (number <= 30) return 'n3'; // Red (Rosehip)
            if (number <= 40) return 'n4'; // Gray (Viola)
            return 'n5'; // Green (Apple)
        }

        // 백엔드로 로그를 보내는 함수 (app.py의 log_event와 연동)
        window.logEventToBackend = async function(event, detail) {
            try {
                // Flask 서버의 /log_event 엔드포인트로 POST 요청
                await fetch(`${window.location.origin}/log_event`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ event: event, detail: detail })
                });
            } catch (error) {
                console.error('Failed to send log to backend:', error);
            }
        }

        window.shareResult = function() {
            const resultType = resultTypeElement.textContent;
            let fullDescription = resultDescriptionElement.textContent;
            let shareDescription = fullDescription;
            // '추천 로또 번호:' 이후의 텍스트는 공유 메시지에 포함하지 않도록 처리
            const splitByLottoNumbers = fullDescription.split('\n\n추천 로또 번호:');
            shareDescription = splitByLottoNumbers[0].trim();

            const shareUrl = "https://smartpick.wow-daddy.com/lotto-dna-test";

            // Kakao SDK가 로드되었는지 확인 후 초기화 및 공유 시도
            if (typeof Kakao !== 'undefined') {
                if (!Kakao.isInitialized()) {
                    // TODO: 사용자님의 실제 Kakao JavaScript Key로 교체하세요.
                    // Kakao Developers (developers.kakao.com)에서 앱을 생성하고 발급받을 수 있습니다.
                    Kakao.init('YOUR_JAVASCRIPT_KEY'); 
                    console.log('Kakao SDK initialized:', Kakao.isInitialized());
                }

                if (Kakao.isInitialized()) {
                    Kakao.Share.sendDefault({
                        objectType: 'feed',
                        content: {
                            title: `💰 당신의 로또 DNA는? - ${resultType}`,
                            description: shareDescription, // 수정된 설명 사용
                            imageUrl: 'https://placehold.co/1200x630/AAD59E/ffffff?text=Lotto+DNA+Test', // TODO: 실제 OG 이미지 URL로 교체
                            link: {
                                mobileWebUrl: shareUrl,
                                webUrl: shareUrl,
                            },
                        },
                        buttons: [
                            {
                                title: '내 유형 확인하기',
                                link: {
                                    mobileWebUrl: shareUrl,
                                    webUrl: shareUrl,
                                },
                            },
                        ],
                    });
                    // 로그 이벤트: 카카오톡 공유
                    window.logEventToBackend('dna_test_share', { 
                        user_ip: '{{ request.remote_addr }}', 
                        result_type: resultType, 
                        platform: 'kakao' 
                    });
                } else {
                    // Kakao SDK 초기화 실패 메시지
                    const msgBox = document.createElement('div');
                    msgBox.textContent = `[카카오톡 공유 실패] Kakao SDK 초기화에 실패했습니다. Kakao Developers에서 JavaScript 키를 설정하고 도메인을 등록했는지 확인해주세요.`;
                    msgBox.style.cssText = `
                        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                        background-color: var(--color-brick); 
                        color: white; padding: 20px;
                        border-radius: 10px; z-index: 1000; opacity: 0; transition: opacity 0.5s;
                        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                        white-space: pre-line; 
                        text-align: left;
                        max-width: 80%; 
                        box-sizing: border-box;
                    `;
                    document.body.appendChild(msgBox);
                    setTimeout(() => msgBox.style.opacity = 1, 10);
                    setTimeout(() => {
                        msgBox.style.opacity = 0;
                        msgBox.addEventListener('transitionend', () => msgBox.remove());
                    }, 5000);
                }
            } else {
                // Kakao SDK가 로드되지 않은 경우 메시지
                const msgBox = document.createElement('div');
                msgBox.textContent = `[카카오톡 공유 실패] Kakao SDK가 로드되지 않았습니다. 네트워크 연결을 확인하거나 잠시 후 다시 시도해주세요.`;
                msgBox.style.cssText = `
                    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                    background-color: var(--color-brick); 
                    color: white; padding: 20px;
                    border-radius: 10px; z-index: 1000; opacity: 0; transition: opacity 0.5s;
                    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                    white-space: pre-line; 
                    text-align: left;
                    max-width: 80%; 
                    box-sizing: border-box;
                `;
                document.body.appendChild(msgBox);
                setTimeout(() => msgBox.style.opacity = 1, 10);
                setTimeout(() => {
                    msgBox.style.opacity = 0;
                    msgBox.addEventListener('transitionend', () => msgBox.remove());
                }, 5000);
            }
        }

        // 초기 로드 시 시작 화면 표시 및 이벤트 리스너 부착
        document.addEventListener('DOMContentLoaded', () => {
            // 버튼 요소들을 DOMContentLoaded 시점에 가져옴
            startButtonElement = document.getElementById('start-button-element');
            nextButtonElement = document.getElementById('next-button-element');
            showResultButtonElement = document.getElementById('show-result-button-element');
            shareButtonElement = document.getElementById('share-button-element');

            // 이벤트 리스너 부착
            if (startButtonElement) {
                startButtonElement.addEventListener('click', window.startTest);
            }
            if (nextButtonElement) {
                nextButtonElement.addEventListener('click', window.nextQuestion);
            }
            if (showResultButtonElement) {
                showResultButtonElement.addEventListener('click', window.showResult);
            }
            if (shareButtonElement) {
                shareButtonElement.addEventListener('click', window.shareResult);
            }

            startScreen.style.display = 'block';
            questionScreen.style.display = 'none';
            resultScreen.style.display = 'none';
        });

    </script>
</body>
</html>
