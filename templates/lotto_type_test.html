            },
            {

                options: [
                    { text: "대박 아니면 쪽박! 일확천금을 꿈꾸며<br>심장이 두근거린다.", score: 1 },
                    { text: "어차피 기대는 안 했지만,<br>혹시나 하는 마음에 침착하게 확인한다.", score: 2 },
                    { text: "꼼꼼하게 번호를 대조하며<br>분석적으로 다음 회차를 생각한다.", score: 3 }

            },
            {
                question: "친구가 로또 번호를<br>추천해달라고 한다면?",
                options: [
                    { text: "직감으로 '이 번호가 좋을 것 같아!'라고 즉흥적으로 알려준다.", score: 1 },
                    { text: "친구의 생일이나 좋아하는 숫자를 물어보고 조합해준다.", score: 2 },
                    { text: "최근 당첨 패턴을 분석하여 '이런 경향이 있으니 참고해봐!'라고 조언한다.", score: 3 }
                ]
            },
            {

                options: [
                    { text: "자동으로 구매하거나,<br>기계가 뽑아주는 번호를 믿는다.", score: 1 },
                    { text: "수동으로 직접 고르되, 홀짝 비율이나<br>번호대 분포를 살짝 고려한다.", score: 2 },
                    { text: "과거 당첨 번호 데이터나 특정 패턴을<br>염두에 두고 신중하게 고른다.", score: 3 }

            {
                question: "만약 로또 1등에 당첨된다면 가장 먼저 할 일은?",

                    { text: "재무 전문가와 상담하여 안정적인<br>자산 관리 계획을 세운다.", score: 3 }

        // 새로운 함수: AdSense 광고를 다시 로드합니다.
        function loadAds() {
            // 페이지에 있는 모든 'adsbygoogle' 클래스를 가진 요소를 찾습니다.
            const adContainers = document.querySelectorAll('.ad-area');
            adContainers.forEach(container => {
                // 기존 광고를 비웁니다.
                container.innerHTML = ''; 
                // 새로운 광고 단위를 생성하여 추가합니다.
                const ins = document.createElement('ins');
                ins.className = 'adsbygoogle';
                ins.style.display = 'block';
                ins.style.textAlign = 'center'; // 스타일은 기존과 동일하게 유지
                ins.dataset.adClient = 'ca-pub-2748658493247983';
                ins.dataset.adSlot = '1322588827';
                ins.dataset.adFormat = 'auto';
                ins.dataset.fullWidthResponsive = 'true';
                container.appendChild(ins);
            });

            // Google AdSense 라이브러리에 새 광고가 있음을 알립니다.
            // window.adsbygoogle 배열에 모든 새 광고 단위를 추가하여 로드를 요청합니다.
            if (window.adsbygoogle && typeof window.adsbygoogle.push === 'function') {
                // 광고 컨테이너가 렌더링될 시간을 주기 위해 setTimeout 사용
                setTimeout(() => {
                    try {
                        // 광고 컨테이너의 실제 너비를 콘솔에 출력하여 디버깅에 활용
                        const adContainerWidth = document.querySelector('.ad-area').offsetWidth;
                        console.log('Ad container offsetWidth before push:', adContainerWidth);
                        (window.adsbygoogle = window.adsbygoogle || []).push({});
                    } catch (e) {
                        console.error("adsbygoogle.push() error:", e);
                    }
                }, 1000); // 1000ms (1초) 지연
            }
        }


        function startTest() {
            logEvent('lotto_dna_test_start'); // 테스트 시작 이벤트 로깅
            currentQuestionIndex = 0;
            totalScore = 0;
            startScreen.style.display = 'none';
            questionScreen.style.display = 'block';
            resultScreen.style.display = 'none';
            loadQuestion();
            loadAds(); // 질문 화면으로 넘어갈 때 광고 다시 로드
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            questionText.innerHTML = `Q${currentQuestionIndex + 1}. ${q.question}`; // innerHTML로 변경하여 <br> 태그 인식
            optionsGrid.innerHTML = '';
            q.options.forEach((option, index) => {
                const optionCard = document.createElement('div');
                optionCard.classList.add('option-card');
                optionCard.innerHTML = option.text; // innerHTML로 변경하여 <br> 태그 인식
                optionCard.dataset.score = option.score;
                optionCard.addEventListener('click', () => selectOption(optionCard));
                optionsGrid.appendChild(optionCard);
            });
            nextButton.style.display = 'none'; // 다음 질문 버튼 숨김
            // loadAds(); // (선택 사항) 각 질문 로드 시 광고를 다시 로드하려면 이 줄의 주석을 해제하세요.
        }

        function selectOption(selectedCard) {
            // 다른 선택된 옵션 스타일 제거
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('selected');
            });
            // 현재 선택된 옵션에 스타일 추가
            selectedCard.classList.add('selected');
            // 다음 질문 버튼 표시
            nextButton.style.display = 'flex';
        }

        function nextQuestion() {
            const selectedOption = document.querySelector('.option-card.selected');
            if (selectedOption) {
                totalScore += parseInt(selectedOption.dataset.score);
                currentQuestionIndex++;

                if (currentQuestionIndex < questions.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            } else {
                showToastMessage('옵션을 선택해주세요!', 'error');
            }
        }

        async function showResult() {
            logEvent('lotto_dna_test_result_view', { score: totalScore }); // 결과 확인 이벤트 로깅
            questionScreen.style.display = 'none';
            resultScreen.style.display = 'block';

            let type = '';
            let description = '';
            let lottoTypeForAPI = '';

            if (totalScore >= 5 && totalScore <= 7) {
                type = "즉흥왕 DNA 👑";
                description = "당신은 로또도 인생처럼 즉흥적으로<br>즐기는 자유로운 영혼!<br>운명에 맡기는 당신의 쿨함이<br>행운을 불러올 거예요.<br>번호에 너무 연연하기보다,<br>로또를 사는 그 순간의<br>즐거움을 만끽하는 것이 중요합니다.<br>SmartPick이 당신의 즉흥적인<br>선택에 행운을 더해 줄 거예요!";
                lottoTypeForAPI = 'impulsive';
            } else if (totalScore >= 8 && totalScore <= 11) {
                type = "밸런서 DNA ⚖️";
                description = "당신은 합리와 감성 사이에서<br>균형을 잡는 현명한 밸런서!<br>로또도 너무 감정에 치우치지 않고,<br>그렇다고 너무 분석에만<br>몰두하지도 않네요.<br>SmartPick은 당신의 균형 잡힌 선택에<br>정확성을 더해 줄 것입니다.<br>때로는 직감을,<br>때로는 통계를 활용해 보세요!";
                lottoTypeForAPI = 'balanced';
            } else { // totalScore >= 12
                type = "전략가 DNA 💡";
                description = "당신은 로또도 철저한 분석과<br>전략으로 접근하는 타고난 전략가!<br>확률과 데이터를 기반으로<br>최적의 선택을 하려는<br>당신의 노력이<br>언젠가 빛을 발할 거예요.<br>SmartPick의 상세 필터링 기능이<br>당신의 예리한 분석력을<br>더욱 날카롭게 만들어 줄 것입니다.<br>행운은 준비된 자에게 찾아옵니다!";
                lottoTypeForAPI = 'strategic';
            }

            resultType.textContent = type;
            resultDescription.innerHTML = description; // innerHTML로 변경하여 <br> 태그 인식

            // 로또 번호 가져오기 (백엔드 API 호출)
            try {
                // 절대 경로 사용
                const response = await fetch(`${BASE_URL}/generate_dna_lotto_numbers`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dna_type: lottoTypeForAPI }) // DNA 유형 전달 (현재는 무작위 생성이라 미사용)
                });
                const data = await response.json();
                if (response.ok) {
                    lottoNumbers = data.numbers;
                    displayLottoNumbers(lottoNumbers); // 정렬된 번호 표시 함수 호출
                } else {
                    console.error('Failed to fetch lotto numbers:', data.error);
                    showToastMessage('로또 번호 생성에 실패했습니다.', 'error');
                }
            } catch (error) {
                console.error('Error fetching lotto numbers:', error);
                showToastMessage('로또 번호 생성 중 오류가 발생했습니다.', 'error');
            }
            loadAds(); // 결과 화면으로 넘어갈 때 광고 다시 로드
        }

        function displayLottoNumbers(numbers) {
            lottoNumbersDisplay.innerHTML = ''; // 기존 번호 초기화
            // 번호를 오름차순으로 정렬
            const sortedNumbers = [...numbers].sort((a, b) => a - b); 

            sortedNumbers.forEach((num) => { // 정렬된 번호 사용
                const lottoBall = document.createElement('div');
                lottoBall.classList.add('lotto-ball', `n${Math.min(Math.ceil(num / 10), 5)}`); // 1-10:n1, 11-20:n2...
                lottoBall.textContent = num;
                lottoNumbersDisplay.appendChild(lottoBall);
            });
        }

        function shareResult() {
            logEvent('lotto_dna_test_share', { type: resultType.textContent, numbers: lottoNumbers.join(',') }); // 공유 이벤트 로깅
            if (Kakao.isInitialized()) {
                Kakao.Share.sendDefault({
                    objectType: 'feed',
                    content: {
                        title: `💰 당신의 로또 DNA는?! ${resultType.textContent} ✨`,
                        description: `${resultDescription.textContent.split('.')[0]}. \n\n이번 주 행운의 로또 번호는 [${lottoNumbers.join(', ')}] 입니다!`,
                        imageUrl:
                            'https://smartpick.wow-daddy.com/images/og_lottodna.png', // 실제 이미지 URL 사용
                        link: {
                            mobileWebUrl: 'https://smartpick.wow-daddy.com/lotto-dna-test',
                            webUrl: 'https://smartpick.wow-daddy.com/lotto-dna-test',
                        },
                    },
                    buttons: [
                        {
                            title: '나도 테스트 해보기',
                            link: {
                                mobileWebUrl: 'https://smartpick.wow-daddy.com/lotto-dna-test',
                                webUrl: 'https://smartpick.wow-daddy.com/lotto-dna-test',
                            },
                        },
                    ],
                });
            } else {
                showToastMessage('카카오톡 공유 기능을 초기화할 수 없습니다.', 'error');
                console.error('Kakao SDK is not initialized.');
            }
        }

        // 토스트 메시지 함수
        function showToastMessage(message, type = 'info') {
            const msgBox = document.createElement('div');
            msgBox.textContent = message;
            msgBox.style.cssText = `
                position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                background-color: ${type === 'error' ? '#f44336' : '#4CAF50'};
                color: white; padding: 15px 20px;
                border-radius: 10px; z-index: 1000; opacity: 0; transition: opacity 0.5s;
            `;
            document.body.appendChild(msgBox);
            setTimeout(() => msgBox.style.opacity = 1, 10);
            setTimeout(() => {
                msgBox.style.opacity = 0;
                msgBox.addEventListener('transitionend', () => msgBox.remove());
            }, 5000);
        }

        // 초기 로드 시 시작 화면 표시 및 이벤트 리스너 부착
        document.addEventListener('DOMContentLoaded', () => {
            // 버튼 요소들을 DOMContentLoaded 시점에 가져옴
            startButtonElement = document.getElementById('start-button-element');
            nextButtonElement = document.getElementById('next-button'); 
            kakaoShareButtonElement = document.getElementById('kakao-share-button-dna'); 

            // 이벤트 리스너 부착
            if (startButtonElement) {
                startButtonElement.addEventListener('click', startTest);
            }
            if (nextButtonElement) { 
                nextButtonElement.addEventListener('click', nextQuestion);
            }
            if (kakaoShareButtonElement) { 
                kakaoShareButtonElement.addEventListener('click', shareResult);
            }

            startScreen.style.display = 'block';
            // 초기에는 질문 화면과 결과 화면을 숨깁니다.
            questionScreen.style.display = 'none'; 
            resultScreen.style.display = 'none';

            // 페이지 로드 시 시작 화면에 광고를 로드
            loadAds();
        });

    </script>
